<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Admin Login - Terapias Bogotá</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #15B9D9 0%, #EFA286 100%);
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, #15B9D9 0%, #EFA286 100%);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        
        .login-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #15B9D9;
            box-shadow: 0 0 0 0.2rem rgba(21, 185, 217, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #15B9D9 0%, #EFA286 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(21, 185, 217, 0.3);
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }
        
        .back-link {
            color: #15B9D9;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #EFA286;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-shield"></i>
                <h2 class="mb-0">Panel Administrativo</h2>
                <p class="mb-0">Terapias Bogotá</p>
            </div>
            
            <div class="login-body">
                <div id="login-alert" class="alert alert-danger d-none" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span id="alert-message"></span>
                </div>
                
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">
                            <i class="fas fa-user me-2"></i>Usuario
                        </label>
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="Ingresa tu usuario" required
                               aria-required="true">
                        <div class="invalid-feedback">
                            Por favor ingresa tu usuario.
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">
                            <i class="fas fa-lock me-2"></i>Contraseña
                        </label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Ingresa tu contraseña" required
                               aria-required="true">
                        <div class="invalid-feedback">
                            Por favor ingresa tu contraseña.
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left me-2"></i>Volver al sitio
                    </a>
                </div>
                
                <div class="mt-4 text-center">
                    <small class="text-muted">
                        <i class="fas fa-info-circle me-1"></i>
                        Usuario: <strong>admin</strong> | Contraseña: <strong>terapias2024</strong>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const loginAlert = document.getElementById('login-alert');
            const alertMessage = document.getElementById('alert-message');
            
            // Verificar si ya está autenticado
            if (authManager.isAuthenticated()) {
                window.location.href = 'admin.html';
                return;
            }
            
            // Manejar envío del formulario
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Validar formulario
                if (!loginForm.checkValidity()) {
                    e.stopPropagation();
                    loginForm.classList.add('was-validated');
                    return;
                }
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Intentar login
                const result = authManager.login(username, password);
                
                if (result.success) {
                    // Login exitoso
                    showAlert('success', result.message);
                    
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    // Login fallido
                    showAlert('danger', result.message);
                }
            });
            
            // Función para mostrar alertas
            function showAlert(type, message) {
                loginAlert.className = `alert alert-${type}`;
                alertMessage.textContent = message;
                loginAlert.classList.remove('d-none');
                
                if (type === 'success') {
                    setTimeout(() => {
                        loginAlert.classList.add('d-none');
                    }, 3000);
                }
            }
        });
    </script>
</body>

</html>
